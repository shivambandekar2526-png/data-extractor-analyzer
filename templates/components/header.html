  <header class="app-header">
    <div class="header-left">
      <button type="button" id="btnToggleDrawer" class="btn-drawer-toggle" title="Toggle Sidebar (Ctrl+B)" aria-label="Toggle Sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <div class="header-brand-wrap">
        <h1 class="logo-title">Data Extractor <span class="badge-ai">AI Studio</span></h1>
        <p class="logo-subtitle">Local Autonomous Document Intelligence &amp; Tabulation Platform</p>
      </div>
    </div>
    <div class="header-right">
      <!-- Cloud AI Status (Active / Inactive) -->
      <div id="cloudStatusBadge" class="status-pill status-cloud-pill status-inactive" title="Cloud AI Service Status">
        <span class="status-dot gray"></span>
        <span id="cloudStatusText">Cloud AI: Inactive</span>
      </div>

      <!-- Local AI Status (Active / Inactive) -->
      <div id="aiStatusBadge" class="status-pill status-local-pill status-inactive" title="Local AI Service Status">
        <span class="status-dot gray"></span>
        <span id="aiStatusText">Local AI: Inactive</span>
      </div>

      <!-- Layout Density Segmented Slider / Toggle -->
      <div class="density-segmented-control" id="densitySegmentedControl" role="group" aria-label="Layout Density">
        <button type="button" class="density-seg-btn active" id="btnDensityComfortable" data-density="comfortable" title="Comfortable View">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="3" y1="15" x2="21" y2="15"></line>
          </svg>
          <span>Comfortable</span>
        </button>
        <button type="button" class="density-seg-btn" id="btnDensityCompact" data-density="compact" title="Compact View">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <line x1="3" y1="14" x2="21" y2="14"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
          <span>Compact</span>
        </button>
      </div>

      <!-- Day / Night Mode Toggle -->
      <button type="button" id="themeToggleBtn" class="btn-theme-toggle" title="Toggle Day / Night mode" aria-label="Toggle Day / Night mode">
        <span class="theme-icon icon-sun" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </span>
        <span class="theme-icon icon-moon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="theme-label" id="themeLabelText">Theme</span>
      </button>

      <!-- User Profile & Sign Out Controls -->
      <div id="userProfilePill" class="user-profile-pill" title="Signed in user account">
        <span class="user-avatar-dot"></span>
        <span id="userProfileEmail" class="user-email-text">Signed In</span>
        <button type="button" id="btnSignOutHeader" class="btn-signout-action" title="Sign Out of Workspace" aria-label="Sign Out">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </header>
