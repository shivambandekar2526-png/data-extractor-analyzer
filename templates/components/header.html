  <header class="app-header">
    <div class="header-left">
      <button type="button" id="btnToggleDrawer" class="btn-drawer-toggle" title="Toggle Sidebar (Ctrl+B)" aria-label="Toggle Sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <div>
        <h1 class="logo-title">Data Extractor <span class="badge-ai">AI v1.0</span></h1>
        <p class="logo-subtitle">Self-Learning Local Academic Gazette &amp; Tabulation Extractor</p>
      </div>
    </div>
    <div class="header-right">
      <div class="model-picker-container" id="modelPickerContainer" style="display: none;">
        <span class="model-picker-icon">⚡</span>
        <select id="modelSelector" class="model-select-dropdown" title="Active Local Ollama Model"></select>
      </div>
      <button type="button" id="btnOpenCloudModal" class="btn-sm btn-outline btn-cloud-settings" title="Configure Cloud AI API Key &amp; Hybrid Routing">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Cloud AI</span>
      </button>
      <div id="cloudStatusBadge" class="status-pill status-cloud-pill">
        <span class="status-dot gray"></span>
        <span id="cloudStatusText">Cloud AI: Offline</span>
      </div>
      <div id="aiStatusBadge" class="status-pill status-loading">
        <span class="status-dot"></span>
        <span id="aiStatusText">Connecting to Local AI...</span>
      </div>
      <div class="status-pill status-trained">
        <span class="status-dot green"></span>
        <span>Pre-Trained (4 Archetypes)</span>
      </div>
      <!-- Day / Night Mode Toggle -->
      <button type="button" id="themeToggleBtn" class="btn-theme-toggle" title="Toggle Day / Night mode" aria-label="Toggle Day / Night mode">
        <span class="theme-icon icon-sun" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </span>
        <span class="theme-icon icon-moon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="theme-label" id="themeLabelText">Day</span>
      </button>
    </div>
  </header>

  <!-- Persistent Desktop App Shell: Drawer + Main Workspace -->
  <div class="app-layout-shell" id="appLayoutShell">
    <!-- Persistent Left-Side Collapsible Drawer -->
